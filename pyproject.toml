[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hysmi-top"
version = "0.2.0"
description = "Terminal monitor for Hygon DCU (hy-smi) with nvtop-style scrolling curves"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "mcocdaa" },
]
keywords = [
    "hygon",
    "dcu",
    "hy-smi",
    "gpu-monitor",
    "nvtop",
    "top",
    "tui",
    "curses",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mcocdaa/hysmi-top"
Repository = "https://github.com/mcocdaa/hysmi-top"
Issues = "https://github.com/mcocdaa/hysmi-top/issues"
Changelog = "https://github.com/mcocdaa/hysmi-top/releases"

[project.scripts]
hysmi-top = "hysmi_top.cli:main"

[tool.setuptools.packages.find]
include = ["hysmi_top*"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
