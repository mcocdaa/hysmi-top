version: 2
updates:
  # uv package dependencies
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      uv-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
